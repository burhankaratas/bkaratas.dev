<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yazılar — Panel · bkaratas.dev</title>
  <meta name="description" content="bkaratas.dev yönetim paneli — yazılar.">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0b">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/panel/panel.css">
</head>
<body>

  <div class="panel-shell">

    <aside class="panel-sidebar">
      <a class="side-brand" href="/panel/dashboard">
        <span class="slash">//</span><span>bkaratas.dev</span>
        <span class="tag">panel</span>
      </a>

      <nav class="side-nav" aria-label="Panel">
        <a href="/panel/dashboard"><i>01</i><span>Genel Bakış</span></a>
        <a class="is-active" href="/panel/dashboard/yazilar/"><i>02</i><span>Yazılar</span></a>
        <a href="#"><i>03</i><span>İçerikler</span><span class="soon">yakında</span></a>
        <a href="#"><i>04</i><span>Medya</span><span class="soon">yakında</span></a>
        <a href="#"><i>05</i><span>Mesajlar</span><span class="soon">yakında</span></a>
        <a href="#"><i>06</i><span>Ayarlar</span><span class="soon">yakında</span></a>
      </nav>

      <div class="side-foot">
        <span>v0.2.0 · blog sistemi</span>
      </div>
    </aside>

    <div class="panel-main-col">

      <header class="panel-topbar">
        <span class="topbar-title">yazılar</span>
        <span class="topbar-spacer"></span>
        <span class="user-chip"><span class="dot" aria-hidden="true"></span><span id="panel-user">admin</span></span>
        <button id="logout" class="panel-btn" type="button">Çıkış</button>
      </header>

      <main class="panel-content">

        <div class="panel-head-row">
          <div class="panel-head" style="margin-bottom:0">
            <h1>Yazılar</h1>
            <p>Yazılarını buradan yaz, düzenle, taslak olarak sakla veya yayımla.</p>
          </div>
          <div class="panel-head-actions">
            <a class="btn btn-primary" href="/panel/dashboard/yazilar/duzenle/?new=1">+ Yeni Yazı</a>
          </div>
        </div>

        <div class="flash" id="flash" role="status" aria-live="polite"></div>

        <div class="panel-head-actions" id="filters" style="margin:6px 0 20px">
          <button class="btn btn-sm is-filter" data-filter="all" type="button">Tümü</button>
          <button class="btn btn-sm is-filter" data-filter="published" type="button">Yayında</button>
          <button class="btn btn-sm is-filter" data-filter="draft" type="button">Taslak</button>
        </div>

        <section class="post-list-panel" id="post-list" aria-live="polite">
          <p class="empty">Yükleniyor…</p>
        </section>

      </main>
    </div>
  </div>

  <script type="module" src="/panel/dashboard/yazilar/yazilar.js"></script>
</body>
</html>
