<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      background: #0a0a0b;
      color: #ececec;
      font-family: "Archivo", sans-serif;
      overflow: hidden;
      position: relative;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse at 30% 0%, #000 30%, transparent 80%);
    }

    .frame {
      position: absolute;
      inset: 28px;
      border: 1px solid #232328;
    }

    .inner {
      position: relative;
      height: 100%;
      padding: 74px 78px 66px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "JetBrains Mono", monospace;
      font-size: 21px;
      letter-spacing: 0.02em;
    }

    .brand { color: #ececec; }
    .brand .slash { color: #ffb000; font-weight: 700; }

    .lang {
      color: #6b6b74;
      letter-spacing: 0.22em;
      font-size: 18px;
    }

    .mid { margin-top: 4px; }

    .cmd {
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      color: #9b9ba3;
      margin-bottom: 20px;
    }
    .cmd b { color: #ffb000; font-weight: 700; }

    h1 {
      font-size: 92px;
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.04em;
      margin-bottom: 26px;
    }

    .role {
      font-family: "JetBrains Mono", monospace;
      font-size: 30px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffb000;
    }
    .role::before { content: "> "; color: #6b6b74; }

    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 40px;
    }

    .domains {
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      color: #9b9ba3;
      line-height: 1.7;
    }
    .domains span { color: #6b6b74; }
    .domains b { color: #ececec; font-weight: 500; }

    .code {
      font-family: "JetBrains Mono", monospace;
      font-size: 17px;
      line-height: 1.75;
      color: #9b9ba3;
      border-left: 2px solid #232328;
      padding-left: 22px;
      white-space: pre;
      text-align: left;
    }
    .code .kw { color: #ffb000; font-weight: 700; }
    .code .com { color: #6b6b74; font-style: italic; }
    .code .str { color: #ececec; }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>

  <div class="inner">
    <div class="top">
      <span class="brand"><span class="slash">//</span> bkaratas.dev</span>
      <span class="lang">TR / EN</span>
    </div>

    <div class="mid">
      <p class="cmd"><b>$</b> whoami</p>
      <h1>Mahmut Burhan<br>Karataş</h1>
      <p class="role">Software Developer</p>
    </div>

    <div class="bottom">
      <div class="domains">
        <div><span>&gt;</span> <b>sehvendergisi.com.tr</b></div>
        <div><span>&gt;</span> <b>hesaplariz.org</b></div>
      </div>
      <div class="code"><span class="kw">const</span> dev = {
  name: <span class="str">"Mahmut Burhan Karataş"</span>,
  stack: [<span class="str">"python"</span>, <span class="str">"next.js"</span>],
  status: <span class="str">"open to work"</span>,
};
dev.<span class="kw">ship</span>(); <span class="com">// → bkaratas.dev</span></div>
    </div>
  </div>
</body>
</html>
